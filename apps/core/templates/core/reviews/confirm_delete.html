{% extends "base.html" %}
{% block title %}Hapus ulasan | Sirkula{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl px-5 py-12 sm:py-20" aria-labelledby="delete-title">
    <h1 id="delete-title" class="text-3xl font-semibold">Hapus ulasan ini?</h1>
    <p class="mt-3 text-neutral-80">Ulasan dan seluruh like-nya akan dihapus. Tindakan ini tidak dapat dibatalkan.</p>
    <blockquote class="mt-6 whitespace-pre-line break-words rounded-card-small bg-base-200 p-5">{{ review.content }}</blockquote>
    <form method="post" class="mt-6 flex flex-wrap gap-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-error">Ya, hapus ulasan</button>
        <a href="{% url 'core:home' %}#reviews" class="btn btn-outline btn-primary">Batal</a>
    </form>
</section>
{% endblock %}
