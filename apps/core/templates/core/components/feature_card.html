<article
    aria-labelledby="{{ card_id }}-title"
    class="h-full rounded-xl bg-base-100 p-6 shadow-md"
>
    <h3
        id="{{ card_id }}-title"
        class="text-lg font-semibold leading-7 text-base-content"
    >
        {{ title }}
    </h3>

    <p class="mt-4 text-base leading-6 text-neutral-80">
        {{ description }}
    </p>
</article>
