{% load static %}
{% load currency %}
<a
    href="{% url 'marketplace:product_detail' product.pk %}"
    class="group flex flex-col rounded-xl border border-neutral-300 bg-white p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
>
    <div class="relative h-40 w-full overflow-hidden rounded-lg bg-neutral-20">
        {% if product.image %}
            <img
                src="{{ product.image.url }}"
                alt="{{ product.name }}"
                class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
            >
        {% else %}
            <img
                src="{% static 'img/sirkula.png' %}"
                alt="Belum ada foto"
                class="h-full w-full object-cover"
            >
        {% endif %}
        <span class="absolute left-3 top-3 rounded-md px-2.5 py-1 text-[0.65rem] font-bold uppercase tracking-wide {% if product.listing_type == 'BARTER' %}bg-lime-70 text-neutral-100{% else %}bg-primary text-white{% endif %}">
            {{ product.get_listing_type_display }}
        </span>
    </div>

    <div class="mt-3 flex flex-1 flex-col">
        <span class="text-xs text-neutral-70">
            {% if product.brand %}{{ product.brand }}{% else %}Tanpa merek{% endif %}
        </span>
        <span class="mt-1 line-clamp-1 text-base font-bold text-green-100">
            {{ product.name }}
        </span>
        <span class="mt-1 text-lg font-bold text-green-80">
            Rp {{ product.price|rupiah }}
        </span>

        <div class="mt-auto flex gap-2 pt-3">
            <span class="flex h-10 flex-1 items-center justify-center rounded-full bg-primary text-sm font-semibold text-white">
                Lihat Detail
            </span>
            <span class="flex h-10 w-10 items-center justify-center rounded-lg border border-neutral-300 text-sm font-bold text-neutral-70">
                i
            </span>
        </div>
    </div>
</a>
