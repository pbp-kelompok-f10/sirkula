{% url "main:home" as home_url %}

<header class="border-b border-line bg-navigation">
    <nav
        aria-label="Navigasi utama"
        class="mx-auto flex max-w-7xl flex-wrap items-center
               justify-between gap-4 px-5 py-4 sm:px-8 lg:px-12"
    >
        <a
            href="{{ home_url }}"
            class="rounded-md text-xl font-bold
                   focus-visible:outline-2 focus-visible:outline-offset-4
                   focus-visible:outline-brand"
        >
            Logo
        </a>

        <ul
            class="order-3 flex w-full flex-wrap justify-center gap-2
                   text-sm font-medium sm:order-none sm:w-auto sm:gap-4"
        >
            <li>
                <a
                    href="{{ home_url }}"
                    {% if request.resolver_match.view_name == "main:home" %}
                        aria-current="page"
                    {% endif %}
                    class="inline-flex min-h-11 items-center rounded-full px-4
                           hover:bg-brand-soft
                           aria-[current=page]:bg-ink
                           aria-[current=page]:text-white
                           focus-visible:outline-2 focus-visible:outline-offset-4
                           focus-visible:outline-brand"
                >
                    Home
                </a>
            </li>

            <!-- Placeholder labels retained from the Figma design. -->
            <li>
                <button
                    type="button"
                    disabled
                    title="Tujuan menu belum tersedia"
                    class="inline-flex min-h-11 items-center rounded-full px-4
                           disabled:cursor-not-allowed"
                >
                    Home
                </button>
            </li>

            <li>
                <button
                    type="button"
                    disabled
                    title="Tujuan menu belum tersedia"
                    class="inline-flex min-h-11 items-center rounded-full px-4
                           disabled:cursor-not-allowed"
                >
                    Home
                </button>
            </li>

            <li>
                <button
                    type="button"
                    disabled
                    title="Tujuan menu belum tersedia"
                    class="inline-flex min-h-11 items-center rounded-full px-4
                           disabled:cursor-not-allowed"
                >
                    Home
                </button>
            </li>
        </ul>

        <!-- Replace with a named URL when authentication is available. -->
        <button
            type="button"
            disabled
            title="Login belum tersedia"
            class="inline-flex min-h-11 items-center justify-center gap-2
                   rounded-full bg-brand px-5 text-sm font-medium text-white
                   disabled:cursor-not-allowed"
        >
            Login

            <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-4"
            >
                <path d="M10 17l5-5-5-5M15 12H3"></path>
                <path d="M15 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5"></path>
            </svg>
        </button>
    </nav>
</header>
