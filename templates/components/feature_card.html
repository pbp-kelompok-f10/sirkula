<article
    aria-labelledby="{{ card_id }}-title"
    class="h-full rounded-3xl bg-white p-6 sm:p-8"
>
    <h3
        id="{{ card_id }}-title"
        class="text-lg leading-7 font-semibold tracking-tight text-ink"
    >
        {{ title }}
    </h3>

    <p class="mt-3 text-sm leading-7 text-muted">
        {{ description }}
    </p>
</article>
