{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Sirkula{% endblock title %}</title>

    <meta
        name="description"
        content="{% block description %}Gaya Tanpa Batas, Nol Jejak Baru.{% endblock description %}"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    {% block extra_head %}{% endblock extra_head %}
</head>

<body class="min-h-screen bg-canvas font-sans text-ink antialiased">
    <a
        href="#main-content"
        class="sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50
               focus:not-sr-only focus:rounded-lg focus:bg-white
               focus:px-4 focus:py-3 focus:text-brand focus:shadow-lg"
    >
        Lewati navigasi
    </a>

    {% include "components/navbar.html" %}

    <main id="main-content" tabindex="-1">
        {% block content %}{% endblock content %}
    </main>

    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
